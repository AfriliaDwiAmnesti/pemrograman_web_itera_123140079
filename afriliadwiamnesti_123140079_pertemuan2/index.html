<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Productivity Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header & Quote Section (Async API) -->
        <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 rounded-2xl shadow-md">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold">Halo, Afrilia! 👋</h1>
                    <p class="text-indigo-100 text-sm">Dashboard Produktivitas Mahasiswa Sistem Informasi ITERA</p>
                </div>
                <!-- Widget Cuaca Async -->
                <div id="weatherWidget" class="bg-white/1:// backdrop-blur-md px-4 py-2 rounded-xl text-sm border border-white/20">
                    <span>Moading cuaca ITERA...</span>
                </div>
            </div>
            <!-- Quote Harian -->
            <div class="mt-4 pt-4 border-t border-white/20 text-xs italic text-indigo-100" id="quoteContainer">
                "Memuat kutipan motivasi..."
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Form Tambah Tugas (Kolom 1) -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-slate-700 flex items-center gap-2">
                    📌 Tambah Tugas Baru
                </h2>
                <form id="taskForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Judul Tugas / Mata Kuliah</label>
                        <input type="text" id="taskTitle" placeholder="Cth: Tugas Besar Siskam" required
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Deadline</label>
                        <input type="date" id="taskDate" required
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Prioritas</label>
                        <select id="taskPriority" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                            <option value="Tinggi">Tinggi 🔥</option>
                            <option value="Sedang" selected>Sedang ⚡</option>
                            <option value="Rendah">Rendah ☕</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors text-sm cursor-pointer">
                        Simpan Tugas
                    </button>
                </form>
            </div>

            <!-- List Tugas (Kolom 2 & 3) -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-slate-700">Daftar Tugas & Target Kuliah</h2>
                    <span id="taskCount" class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-full">0 Tugas</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase">
                                <th class="py-2 px-2">Status</th>
                                <th class="py-2 px-2">Tugas</th>
                                <th class="py-2 px-2">Deadline</th>
                                <th class="py-2 px-2">Prioritas</th>
                                <th class="py-2 px-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody" class="text-sm divide-y divide-slate-100">
                            <!-- Render via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
